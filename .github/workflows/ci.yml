name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependências
        run: python -m pip install pyserial
      - name: Testes
        run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: |
          python -m pip install pyserial
          python -m unittest discover -s tests -v
      - name: Instalar NSIS e PyInstaller
        run: |
          choco install nsis -y --no-progress
          python -m pip install "pyinstaller==6.11.1"
      - name: Versão
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import launcher; print(launcher.__version__)')" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/windows/pt2vhf-prog-tool.spec > pyinstaller.log 2>&1 || {
            tail -n 25 pyinstaller.log | sed 's/^/::error title=PyInstaller::/'; exit 1; }
      - name: NSIS
        shell: bash
        run: |
          "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION=${{ steps.ver.outputs.version }} packaging/windows/installer.nsi > nsis.log 2>&1 || {
            tail -n 25 nsis.log | sed 's/^/::error title=NSIS::/'; exit 1; }
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/PT2VHFProgTool-*-instalador.exe
