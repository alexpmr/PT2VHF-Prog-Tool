name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Dependências
        run: python -m pip install pyserial
      - name: Testes
        run: python -m unittest discover -s tests -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes
        run: |
          python -m pip install pyserial
          python -m unittest discover -s tests -v
      - name: Instalar NSIS
        run: choco install nsis -y --no-progress
      - name: Gerar executável e instalador
        shell: cmd
        run: packaging\windows\build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: dist/PT2VHFProgTool-*-instalador.exe
