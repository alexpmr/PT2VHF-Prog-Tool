# GitLab CI/CD - PT2VHF Prog Tool
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - test
  - build

python_tests:
  stage: test
  image: python:3.12-bookworm
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends xvfb tk
  script:
    - python -m pip install -r requirements.txt
    - python -m compileall -q launcher ts2000prog icomprog common main.py
    - xvfb-run -a python -m unittest discover -s tests -v
  timeout: 25m

windows_package:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  script:
    - python -m pip install -r requirements.txt
    - python -m unittest discover -s tests -v
    - 'choco install nsis -y --no-progress'
    - 'cmd /c packaging\\windows\\build.bat'
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - dist/PT2VHFProgTool-*-instalador.exe
  timeout: 90m
